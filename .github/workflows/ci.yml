name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskmanager

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: taskmanager/pom.xml

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Build Docker image
        run: docker build -t taskmanager-api:ci .
